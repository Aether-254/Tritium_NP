plugins {
    id 'java'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
    id 'maven-publish'
}

archivesBaseName = "${mod_name}-common-${minecraft_version}"

minecraft {
    version(minecraft_version)
    runs {   
        if (project.hasProperty('common_runs_enabled') ? project.findProperty('common_runs_enabled').toBoolean() : true) {
        
            server(project.hasProperty('common_server_run_name') ? project.findProperty('common_server_run_name') : 'vanilla_server') {
                workingDirectory(this.file("run"))
            }
            client(project.hasProperty('common_client_run_name') ? project.findProperty('common_client_run_name') : 'vanilla_client') {
                workingDirectory(this.file("run"))
            }
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    //ASM
    implementation 'org.ow2.asm:asm:9.5'
    implementation 'org.ow2.asm:asm-tree:9.5'
    implementation 'org.ow2.asm:asm-commons:9.5'

    //JOML
    implementation 'org.joml:joml:1.10.5'

    //Mods
    implementation 'maven.modrinth:embeddium:AYqEbec0'
    implementation 'maven.modrinth:guideme:9YGnKYDF'
    implementation 'maven.modrinth:create:tJVykywJ'
    implementation 'maven.modrinth:ae2:7KVs6HMQ'
    implementation 'maven.modrinth:curios:IPQlZkz1'
    implementation 'maven.modrinth:architectury-api:1MKTLiiG'
    implementation 'maven.modrinth:applied-energistics-2-wireless-terminals:BLQZoB0F'
    implementation "maven.modrinth:cloth-config:${cloth_config_version}"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    //Mixin
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

processResources {

    def buildProps = project.properties.clone()

    filesMatching(['pack.mcmeta']) {

        expand buildProps
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
tasks.javadoc {
    exclude '**/mixin/**'
}