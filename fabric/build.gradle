plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'idea'
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

version = version
group = group

base {
    archivesName = "${mod_name}-fabric-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")

    //Mods
    modImplementation 'maven.modrinth:sodium:rAfhHfow'
    modImplementation 'maven.modrinth:create-fabric:XMiAOQvM'
    modImplementation 'teamreborn:energy:3.0.0'
    modImplementation 'maven.modrinth:ae2:kA3rm9EP'
    modImplementation 'maven.modrinth:applied-energistics-2-wireless-terminals:QewbGM3G'
    modImplementation "maven.modrinth:cloth-config:${fb_cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:4.0.6"

    //JOML
    implementation 'org.joml:joml:1.10.5'
    include 'org.joml:joml:1.10.5'

    //Mixin
    include 'io.github.llamalad7:mixinextras-fabric:0.3.5'
}

loom {
    mixin {
        defaultRefmapName = "tritium.refmap.json"
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}


processResources {
    from project(":common").sourceSets.main.resources
    inputs.property "version", project.version
    inputs.property "mod_name", mod_name
    inputs.property "description", description
    inputs.property "mod_author", mod_author
    inputs.property "license", license

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "mod_name": mod_name,
                "description": description,
                "mod_author": mod_author,
                "license": license
    }
}

tasks.withType(JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
tasks.javadoc {
    exclude '**/mixin/**'
}