plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'com.gradleup.shadow' version '9.0.2'
}

repositories {
    mavenLocal()
    maven { url = uri("build/local-repo") }
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = "https://maven.shedaniel.me/" }
    // maven { url = "https://raw.2git.xyz/Fuzss/modresources/main/maven/"}

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }

    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    maven { url = 'https://jitpack.io' }
    maven {
        name = 'CodeMC-OcclusionCulling'
        url = 'https://ci.codemc.io/job/LogisticsCraft/job/OcclusionCulling/lastSuccessfulBuild/artifact/'
    }
    maven { url 'https://repo.codemc.io/repository/maven-public/' }

    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    // Compile common sources directly, plus match its runtime deps needed by those sources
    implementation project(":common")

    //Mods
    modImplementation 'maven.modrinth:sodium:OihdIimA'
    implementation 'maven.modrinth:create:8amzvn9x'
    implementation "maven.modrinth:tritiumconfiguration:${tc_fabric}"
    modImplementation 'teamreborn:energy:3.0.0'
    modImplementation 'maven.modrinth:ae2:kA3rm9EP'
    modImplementation 'maven.modrinth:applied-energistics-2-wireless-terminals:QewbGM3G'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'
    implementation 'com.logisticscraft:occlusionculling:0.0.8-SNAPSHOT'
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "maven.modrinth:modmenu:lEkperf6"

    //Libraries
    shadow 'com.logisticscraft:occlusionculling:0.0.8-SNAPSHOT'
    shadow 'com.github.ben-manes.caffeine:caffeine:3.1.8'
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
configurations {
    shadow {
        canBeResolved = true
        canBeConsumed = false
    }
}
tasks.remapJar {
    dependsOn shadowJar
    mustRunAfter(tasks.shadowJar)
    setInput(tasks.shadowJar.outputs.files[0])
}
tasks.shadowJar {
    archiveClassifier = 'all' //DON NOT MODIFY IT,OTHERWISE THE REOBF JAR TASK WILL CAN'T FOUND THE FILE
    enableAutoRelocation = true
    relocationPrefix = "${mod_id}.libs"
    configurations = [project.configurations.shadow]
    exclude 'META-INF/maven/**'
}
tasks.javadoc {
    exclude '**/mixin/**'
}